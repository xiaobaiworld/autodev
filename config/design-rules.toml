# 设计阶段规则（D025）：复杂度判定、按类型的交付物与审查必查项。可提交，不含密钥。
# 由 requirements.design_rules 读取；条件与阈值是初版，需用真实需求校准。

# 事实：判定复杂度和交付物用的是/否条件，由程序取得，不由 Agent 自述。
[facts]
reusable_verified_asset = "有可复用的已验证资产"
changes_interface       = "新增或改动对外接口"
changes_data_structure  = "新增或改动数据结构"
has_ui           = "有用户界面"
touches_real_env = "触碰真实环境或设备"

[complexity]
# 命中任一项即为复杂；或同时满足某一组
complex_if_any = ["touches_real_env"]
complex_if_all = [["changes_interface", "changes_data_structure"]]
# 简单：下面第一组全为真，且第二组全为假
simple_requires_true  = ["reusable_verified_asset"]
simple_requires_false = ["changes_interface", "changes_data_structure", "has_ui", "touches_real_env"]

[levels."简单"]
design_detail = "简略：只保留形式，写变化点并引用被复用资产"
review_depth  = "按类型模板只核对必查项；有适用的已验证复用资产时可免去额外模型审核，改由程序检查文件、引用与版本"

[levels."常规"]
design_detail = "完整"
review_depth  = "完整模板，优先独立审核（不同 Agent/模型，能跨厂商优先），不足时按 D019 降级"

[levels."复杂"]
design_detail = "完整，并写明风险与回退"
review_depth  = "完整模板，优先独立审核；降级放行时定稿时须向用户显式披露"

[deliverables]
# 每次设计都交付；prototype.md 在无界面时写“不适用”及理由
always = ["design.md", "dev-plan.md", "prototype.md"]

[deliverables.when]
has_ui          = ["prototype/index.html"]
changes_data_structure = ["data-spec.md"]

[deliverables.confirm]
has_ui    = "界面原型须用户打开确认"
touches_real_env = "会改动真实环境或设备的步骤须用户确认"

[types.SOFTWARE]
design_sections = ["架构与数据流", "资产复用及证据", "接口契约"]
review = [
  "需求原文逐条对应到设计、接口、数据与任务",
  "接口契约足以让开发按计划执行",
  "有界面时原型覆盖关键操作与状态，无界面时说明不适用",
  "原型与数据规范互相对得上（两者都存在时）",
  "资产复用有证据",
]

[types.DEPLOYMENT]
design_sections = ["部署拓扑与脚本清单", "预检与幂等", "回滚", "对运行中服务的影响"]
review = [
  "预检、幂等、回滚是否齐全",
  "对运行中服务的影响是否评估",
  "脚本清单与拓扑是否一致",
  "会改真实环境的步骤是否标注需用户确认",
]

[types.HARDWARE]
design_sections = ["硬件抽象层与设备协议", "断线与故障处理", "软件模拟器方案"]
review = [
  "设备协议与硬件抽象层是否清楚",
  "断线与故障处理是否齐全",
  "没有真机时能否用模拟器验证",
  "涉及真机或接线的步骤是否标注需用户确认",
]

[hybrid]
# HYBRID 需要用 parts 指明组成部分；各部分的要求取并集，再加下面两项
design_sections = ["部分之间的接口"]
review = ["各组成部分之间的接口是否对齐"]
