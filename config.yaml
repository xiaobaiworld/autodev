# AutoDev 流程配置
# 设计依据：docs/design/2026-11-02-autodev-design.md
# 待定项（executor.agent、reviewer.agent 等）尚未决定，保持 null

projects:
  - name: personagent
    repo: ~/code/personagent
    base_branch: master
    worktree_root: ~/code/.worktrees/personagent
    exclude:
      - .git/
      - ".env*"
      - "*.lock"
      - .local-backups/
      - config.yaml

rounds:
  max: 3                # 超过即进入 needs-human

executor:
  agent: null           # 待定：Claude Code / Codex / 两者都支持
  model: null

reviewer:
  agent: null           # 待定：是否与执行 Agent 强制不同模型
  model: null

scheduler:
  runner: herdr         # 后续用 herdr 管理各 Agent 的 pane
